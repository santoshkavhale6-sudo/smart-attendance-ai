{% extends "base.html" %}
{% block title %}Register Student{% endblock %}
{% block content %}
<div class="page-title"><i class="fas fa-user-plus"></i> Register New Student</div>
<div class="card" style="max-width:500px">
    <form method="POST" action="/register">
        <div class="form-group"><label>Full Name</label><input type="text" name="name" placeholder="e.g. Shahabaj Khan" required></div>
        <div class="form-group"><label>Roll Number</label><input type="text" name="roll_number" placeholder="e.g. CSE2024001" required></div>
        <div class="form-group"><label>Department / Class</label><input type="text" name="department" placeholder="e.g. Computer Engineering"></div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Register & Capture Faces</button>
    </form>
</div>
{% endblock %}
